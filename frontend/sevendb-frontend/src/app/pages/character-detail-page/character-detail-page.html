<div class="layout">

  <!-- SIDEBAR -->
  <app-character-sidebar
    [character]="character">
  </app-character-sidebar>

  <!-- CONTENT -->
  <div class="content">

    <!-- WEAPON SELECTOR -->
     @if(character.weapons){
    <app-weapon-selector
      [weapons]="character.weapons"
      [selectedWeapon]="selectedWeapon"
      (weaponSelected)="onWeaponSelected($event)">
    </app-weapon-selector>
  }

    <!-- SKILLS -->
    <app-weapon-skills
      [character]="character"
      [weapon]="selectedWeapon">
    </app-weapon-skills>

  </div>

</div>
