<div class="character-grid">

  @for (character of characters; track character.id; let i = $index) {

    <div
      class="character-card"
      [class]="getRarityClass(character.rarity)"
      (click)="navigateToSelectedChar(character.id)"
      [style.animationDelay.ms]="i * 60"
    >

      <img
        [src]="character.linkPortrait"
        alt="{{ character.name }}"
      />

      <div class="info">

        <h3>{{ character.name }}</h3>

        <div class="rarity">
          {{ character.rarity }}
        </div>

      </div>

    </div>

  }

</div>
